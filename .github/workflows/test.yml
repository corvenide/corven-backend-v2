name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build every service
        run: |
          for app in api-gateway auth-service workspace-service runtime-service file-service terminal-service cell-service; do
            pnpm nest build "$app"
          done

      - run: pnpm test

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Builds the backend image and runs the tests against it, with
      # PostgreSQL, in Docker.
      - run: bash test/e2e/run.sh
